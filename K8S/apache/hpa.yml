apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apache-hpq
  namespace: apache

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apache-dpl
  
  minReplicas: 1
  maxReplicas: 5
  
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 5
