apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-shop-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/meetgondaliya31/All-DevOps-Learnings-and-Practices.git    # Replace it with your forked repo
    targetRevision: main
    path: K8S/ArgoCD/argocd-demos/declarative_approach/online_shop
  destination:
    server: https://kubernetes.default.svc   # Replace with your Cluster Url, To get run: `argocd cluster list`
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    
