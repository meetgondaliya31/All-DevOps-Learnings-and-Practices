apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app-dpl
  labels:
    app: notes-app
  namespace: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notes-app
  template:
    metadata:
      labels:
        app: notes-app
    spec:
      containers: 
      - name: notes-app-pod
        image: meetgondaliya31/notes-app-k8s
        ports:
        - containerPort: 8000
      tolerations:
      - key: "prod"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

